# Деплой платформы (из корня репозитория, в WSL):
#   DOCKER_CONTEXT=manager docker compose -f deploy/compose.yaml up -d --build
# Настройки и токен — в deploy/.env (создаёт tools/wravler/init-token.sh).
name: workerd

x-build: &build
  context: ..
  dockerfile: engine/Dockerfile

services:
  workerd:
    build:
      <<: *build
      target: platform
    image: workerd-platform:local
    restart: unless-stopped
    environment:
      # Токен API для wravler — из deploy/.env. Без него compose откажется запускаться,
      # а не поднимет платформу с закрытым API.
      WRAVLER_TOKEN: "${WRAVLER_TOKEN:?нет WRAVLER_TOKEN в deploy/.env, создай его через tools/wravler/init-token.sh}"
      # Корневой домен: воркеры на <имя>.<ROOT_DOMAIN>, API на api.<ROOT_DOMAIN>
      ROOT_DOMAIN: "${ROOT_DOMAIN:?нет ROOT_DOMAIN в deploy/.env}"
    # Только internal-сеть: шлюза нет, до хоста/LAN/соседей/интернета маршрута нет.
    # В ней же caddy-server (вход) и egress (выход). Порты на хост не публикуем.
    volumes:
      - workerd_data:/data  # реестр, статика, данные Durable Objects воркеров (workers/<имя>)
    networks:
      workerd_internal:      # Caddy, egress, контейнеры воркеров
        # Постоянный адрес: контейнеры воркеров держат соединения с платформой (tail,
        # статика, service bindings). Пересозданная платформа на том же IP сразу сбрасывает
        # старые соединения (RST), а на новом IP они висели бы до таймаута.
        ipv4_address: "${PLATFORM_IP:-10.0.3.250}"
      control:               # контроллер
    labels:
      # caddy-docker-proxy. Wildcard выдаётся через DNS-01 — это уже настроено
      # глобально в Caddy (acme_dns cloudflare {env.CF_API_TOKEN}), свой tls-блок
      # не добавлять: невалидный блок ломает загрузку конфига для ВСЕХ сайтов.
      # DNS: нужны записи <ROOT_DOMAIN> и *.<ROOT_DOMAIN> на Caddy
      caddy: "${ROOT_DOMAIN}, *.${ROOT_DOMAIN}"
      caddy.reverse_proxy: "{{upstreams 8080}}"

  # Контроллер контейнеров воркеров worker-<имя> (workers/controller). Единственный с
  # доступом к Docker, поэтому живёт только в сети control — кроме него там лишь платформа.
  controller:
    build:
      <<: *build
      target: controller
    image: workerd-controller:local
    restart: unless-stopped
    user: "0:0"  # сокет Docker: root:docker
    environment:
      WRAVLER_TOKEN: "${WRAVLER_TOKEN:?нет WRAVLER_TOKEN в deploy/.env}"
      # контейнеры воркеров запускаются из этого же образа (engine + workerd)
      RUNNER_IMAGE: workerd-controller:local
      DATA_VOLUME: workerd_workerd_data
      RUNNER_NETWORK: workerd_internal
      RUNNER_MEMORY_MB: ${RUNNER_MEMORY_MB:-256}
      RUNNER_CPUS: ${RUNNER_CPUS:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - control

  # Выход в интернет: движок без JS, только публичные адреса (config/egress.capnp)
  egress:
    build:
      <<: *build
      target: egress
    image: workerd-egress:local
    restart: unless-stopped
    networks:
      - workerd_internal     # сюда приходят запросы от workerd
      - egress               # отсюда — наружу

  # Бэкап /data: согласованные снимки SQLite раз в BACKUP_INTERVAL_HOURS, последние BACKUP_KEEP
  backup:
    build:
      context: ../backup
    image: workerd-backup:local
    restart: unless-stopped
    environment:
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - workerd_data:/data
      - ${BACKUP_TARGET:-workerd_backups}:/backups
    network_mode: none  # сеть бэкапу не нужна

volumes:
  workerd_data:
    name: workerd_workerd_data  # имя явно: контроллер монтирует его в контейнеры воркеров
  workerd_backups:

networks:
  workerd_internal:
    external: true
    name: workerd_internal
  # Обычная сеть с выходом наружу — только для egress
  egress:
  # Платформа ↔ контроллер, без выхода наружу
  control:
    internal: true
