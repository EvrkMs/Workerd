name: workerd

services:
  workerd:
    build: ../engine
    image: workerd:local
    restart: unless-stopped
    command: ["--experimental"]  # Worker Loader пока экспериментальный
    environment:
      # Токен API для wravler. deploy.sh берёт его из ~/.config/wravler/token.
      # Пустой токен = API закрыт полностью: `docker compose up` мимо deploy.sh
      # пересоздаст контейнер без токена, и wravler начнёт получать 401. Поднимать только через deploy.sh.
      WRAVLER_TOKEN: ${WRAVLER_TOKEN:-}
    # Порты на хост не публикуем. Сеть caddy_workerd общая только с caddy-server,
    # поэтому соседи из сети caddy (соседние сервисы и контроллер Caddy) workerd не видят.
    volumes:
      - workerd_app:/app    # config.capnp + код платформы (кладёт deploy.sh)
      - workerd_data:/data  # реестр воркеров и данные Durable Objects
    networks:
      - caddy_workerd
    labels:
      # caddy-docker-proxy. Wildcard выдаётся через DNS-01 — это уже настроено
      # глобально в Caddy (acme_dns cloudflare {env.CF_API_TOKEN}), свой tls-блок
      # не добавлять: невалидный блок ломает загрузку конфига для ВСЕХ сайтов.
      caddy: "workers.ava-kk.ru, *.workers.ava-kk.ru"
      caddy.reverse_proxy: "{{upstreams 8080}}"

volumes:
  workerd_app:
  workerd_data:

networks:
  caddy_workerd:
    external: true
    name: caddy_workerd
