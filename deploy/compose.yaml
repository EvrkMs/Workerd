name: workerd

services:
  workerd:
    build: ../engine
    image: workerd:local
    restart: unless-stopped
    # Порты на хост не публикуем: Caddy ходит к контейнеру через overlay-сеть caddy
    volumes:
      - workerd_app:/app    # config.capnp + собранные воркеры (кладёт deploy.sh)
      - workerd_data:/data  # sqlite Durable Objects
    networks:
      - caddy
    labels:
      # caddy-docker-proxy. Wildcard выдаётся через DNS-01 — это уже настроено
      # глобально в Caddy (acme_dns cloudflare {env.CF_API_TOKEN}), свой tls-блок
      # не добавлять: невалидный блок ломает загрузку конфига для ВСЕХ сайтов.
      caddy: "workers.ava-kk.ru, *.workers.ava-kk.ru"
      caddy.reverse_proxy: "{{upstreams 8080}}"

volumes:
  workerd_app:
  workerd_data:

networks:
  caddy:
    external: true
    name: caddy
