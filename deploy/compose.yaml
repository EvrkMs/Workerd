name: workerd

services:
  workerd:
    build: ../engine
    image: workerd:local
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - workerd_app:/app    # config.capnp + собранные воркеры (кладёт deploy.sh)
      - workerd_data:/data  # sqlite Durable Objects

volumes:
  workerd_app:
  workerd_data:
