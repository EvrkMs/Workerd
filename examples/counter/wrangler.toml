# Пример с Durable Object (SQLite): wravler deploy → https://counter.<ROOT_DOMAIN>/<путь>
# Счётчик обращений по пути; данные переживают новые версии и перезапуск платформы.
name = "counter"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]
