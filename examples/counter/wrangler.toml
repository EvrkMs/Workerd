# Пример с Durable Object. Платформа пока DO не поддерживает — деплой будет отклонён
# с понятной ошибкой. Оставлен как цель для следующего этапа (DO через facets).
name = "counter"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]
